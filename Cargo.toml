[package]
name = "semantic-search"
version = "0.6.0"
edition = "2021"
authors = ["Manuel <lecodev-26@github.com>"]
description = "🔍 Buscador semántico de código con TF-IDF, caché y filtros avanzados"
license = "MIT"
repository = "https://github.com/lecodev-26/semantic-search"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "color"] }
colored = "2.1"
walkdir = "2.4"
anyhow = "1.0"
ignore = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
byte-unit = "5.1"

[dev-dependencies]
assert_cmd = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
