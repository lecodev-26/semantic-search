[package]
name = "semantic-search"
version = "0.1.0"
edition = "2021"
authors = ["Manuel <lecodev-26@github.com>"]
description = "🔍 Semantic code search engine"
license = "MIT"
repository = "https://github.com/lecodev-26/semantic-search"

[dependencies]
clap = { version = "4.5", features = ["derive", "color"] }
colored = "2.1"
walkdir = "2.4"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
